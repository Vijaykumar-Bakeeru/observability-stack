# Values for open-telemetry/opentelemetry-collector (chart 0.173.1),
# "deployment" mode - a stateless Deployment that apps in the cluster
# send OTLP to via its ClusterIP Service.

mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
  
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  prometheus:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}
    resource:
      attributes:
        - key: deployment.environment
          value: minikube-cluster
          action: upsert

  exporters:
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion:
        enabled: true
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [resource, batch]
        exporters: [prometheus]
      traces:
        receivers: [otlp]
        processors: [resource, batch]
        exporters: [otlp/tempo]
      logs:
        receivers: [otlp]
        processors: [resource, batch]
        exporters: [otlphttp/loki]
