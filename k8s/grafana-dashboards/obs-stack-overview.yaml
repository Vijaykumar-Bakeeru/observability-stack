# Auto-derived from docker/grafana/provisioning/dashboards/json/otel-collector-overview.json
# so the same dashboard shows up in both Compose and Kubernetes Grafana,
# without hand-copying JSON (error prone). If you edit the dashboard, edit
# the source file under docker/ and regenerate this one to match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-obs-stack-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  otel-collector-overview.json: |
    {
      "title": "Observability Stack Overview",
      "uid": "obs-stack-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "demo-app /work requests (rate)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "rate(demo_app_work_requests_total[5m])",
              "legendFormat": "requests/sec"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "OTel Collector - accepted spans",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "rate(otelcol_receiver_accepted_spans_total[5m])",
              "legendFormat": "{{receiver}}"
            }
          ]
        },
        {
          "type": "logs",
          "title": "demo-app logs",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "Loki"
          },
          "targets": [
            {
              "expr": "{container=\"demo-app\"}"
            }
          ]
        }
      ]
    }
