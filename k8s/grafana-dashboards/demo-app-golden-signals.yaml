# Auto-derived from docker/grafana/provisioning/dashboards/json/demo-app-golden-signals.json
# so the same dashboard shows up in both Compose and Kubernetes Grafana,
# without hand-copying JSON (error prone). If you edit the dashboard, edit
# the source file under docker/ and regenerate this one to match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-demo-app-golden-signals
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  demo-app-golden-signals.json: |
    {
      "title": "demo-app - Golden Signals (RED)",
      "uid": "demo-app-golden-signals",
      "tags": [
        "demo-app",
        "red-metrics"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "Rate - requests/sec",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(demo_app_work_requests_total[5m]))",
              "legendFormat": "req/sec"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Errors - error rate %",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.2
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(demo_app_errors_total[5m])) / sum(rate(demo_app_work_requests_total[5m]))",
              "legendFormat": "error rate"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Errors by type",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (error_type) (rate(demo_app_errors_total[5m]))",
              "legendFormat": "{{error_type}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Duration - p50 / p95 / p99 latency",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(demo_app_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(demo_app_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(demo_app_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Current error rate",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(demo_app_errors_total[5m])) / sum(rate(demo_app_work_requests_total[5m]))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Current p95 latency",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(demo_app_request_duration_seconds_bucket[5m])) by (le))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Total requests (24h)",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(demo_app_work_requests_total[24h]))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Total errors (24h)",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 17
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(demo_app_errors_total[24h]))"
            }
          ]
        }
      ]
    }
